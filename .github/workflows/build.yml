name: Deploy Static Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # আপনার সাইটটি তৈরি বা কপি করার প্রয়োজন হলে এখানে কমান্ড দিতে পারেন
      - name: Build Web App
        run: |
          echo "Building the web app..."
          # এখানে কোনো npm build বা কপি কমান্ড দিতে পারেন

      # (ঐচ্ছিক) GitHub Pages-এ ডেপ্লয় করতে চাইলে নিচের অংশটি ব্যবহার করুন
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/src/main  # যেখানে আপনার index.html আছে (আপনার পাথ অনুযায়ী ঠিক করে নিন)